name: Unit Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: scope
        uses: ./.github/actions/change-scope
      - if: steps.scope.outputs.required == 'true'
        run: make unit-test
