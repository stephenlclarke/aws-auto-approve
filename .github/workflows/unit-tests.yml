name: Unit Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make unit-test
