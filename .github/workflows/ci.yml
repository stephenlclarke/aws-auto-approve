name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Native tests, coverage and app bundle
        run: make coverage bundle
      - name: Check installed bundle entry point
        run: |
          make install
          "$HOME/.local/bin/aws-auto-approve" --help
      - name: SonarQube analysis on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          brew install sonar-scanner
          make sonar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-auto-approve-macos
          path: |
            dist/
            coverage.xml
