name: CodeQL
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - 'docs/**'
      - '**/docs/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  paths:
    name: CodeQL path check
    uses: ./.github/workflows/change-scope.yml
  analyze:
    name: CodeQL (${{ matrix.name }})
    needs: paths
    if: always() && !cancelled()
    runs-on: ${{ needs.paths.outputs.required == 'true' && matrix.runner || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift
            language: swift
            runner: macos-26
            build-mode: manual
          - name: JavaScript
            language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - name: Ruby
            language: ruby
            runner: ubuntu-latest
            build-mode: none
          - name: Actions
            language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - name: Validate workload decision
        env:
          FILTER_RESULT: ${{ needs.paths.result }}
          REQUIRED: ${{ needs.paths.outputs.required }}
        run: |
          test "$FILTER_RESULT" = success
          case "$REQUIRED" in true|false) ;; *) exit 1 ;; esac
          printf 'Full workload required: **%s**.\n' "$REQUIRED" >> "$GITHUB_STEP_SUMMARY"
      - if: needs.paths.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select CodeQL-compatible Xcode
        if: needs.paths.outputs.required == 'true' && matrix.language == 'swift'
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          printf '%s\n' 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Prepare Swift package outside the tracer
        if: needs.paths.outputs.required == 'true' && matrix.language == 'swift'
        run: |
          printf 'SWIFT=%s\n' "$(xcrun --toolchain XcodeDefault --find swift)" >> "$GITHUB_ENV"
          # The build tracer uses Rosetta; match its manifest-cache architecture.
          arch -x86_64 make resolve
      - name: Initialise CodeQL
        if: needs.paths.outputs.required == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Swift for analysis
        if: needs.paths.outputs.required == 'true' && matrix.language == 'swift'
        run: make build
      - name: Analyse and upload results
        if: needs.paths.outputs.required == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
