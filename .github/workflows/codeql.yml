name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift
            language: swift
            runner: macos-26
            build-mode: manual
          - name: JavaScript
            language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - name: Ruby
            language: ruby
            runner: ubuntu-latest
            build-mode: none
          - name: Actions
            language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Swift for analysis
        if: matrix.language == 'swift'
        run: make build
      - name: Analyse and upload results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
